[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ladmm-tv-ct"
version = "0.1.0"
description = "Linearised-ADMM total-variation reconstruction for sparse-view cone-beam CT (TIGRE + SCICO)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Riccardo Ferretti" }]
requires-python = ">=3.10"
# NOTE: TIGRE (CERN, CT toolbox) must be installed from source — see README.
# Do NOT `pip install tigre`: that PyPI name is an unrelated bioinformatics tool.
dependencies = [
    "numpy>=1.24",
    "jax>=0.4.30",
    "scico>=0.0.6",
    "nibabel>=5.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "ipykernel"]

[project.scripts]
ladmm-tv-ct = "ladmm_tv_ct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
